# CUDA Configuration for SCOPE Smart Building System
# Optimized for Windows NVIDIA GPU deployment with TensorRT

# Device Configuration
device:
  auto_detect: true
  preferred: "cuda"  # Windows NVIDIA GPU primary target
  cuda:
    memory_fraction: 0.85       # Higher allocation for Windows NVIDIA
    enable_tensorrt: true
    workspace_size_gb: 6        # Increased for Windows GPU memory
    enable_half_precision: true
    enable_compilation: true
    mixed_precision: true       # Windows NVIDIA mixed precision
  cpu:
    num_threads: 8              # Windows multi-core fallback
    enable_mkldnn: true

# Stage 1 Configuration - Fast Token Detection
stage1:
  models:
    object_detector: "yolov8m.pt"           # Improved accuracy with YOLOv8m
    spill_detector: null                    # BiSeNet V2 uses pre-trained model
  
  # Performance settings
  target_latency_ms: 20
  confidence_threshold: 0.35
  iou_threshold: 0.5
  max_detections: 30
  image_size: 640                           # Higher resolution for accuracy
  batch_size: 1                             # Real-time processing
  
  # Quantization settings
  quantization: "fp16"                      # fp32, fp16, int8
  
  # Model-specific configurations
  object_detection:
    input_size: 640                         # YOLOv8m input resolution
    coco_classes: true                      # Use COCO 80 classes
    building_filter: true                   # Filter for building-relevant objects
    
  spill_detection:
    input_size: 512                         # BiSeNet V2 segmentation resolution
    fast_mode: true                         # Use fast mode for Stage 1
    min_spill_area: 100                     # Minimum pixels for spill detection
    
  # Detection categories for Stage 1 (now handled by COCO classes + spill segmentation)
  detection_prompts:
    # High-priority COCO classes for building safety
    - "person"
    - "laptop"
    - "cell phone" 
    - "backpack"
    - "handbag"
    - "suitcase"
    - "bottle"
    - "chair"
    - "tv"
    - "book"
    - "scissors"

# Stage 2 Configuration - Heavy Verification  
stage2:
  model: "rtdetr-l.pt"                      # Large model for accuracy
  spill_verification: "bisenetv2"           # Use BiSeNet V2 for spill verification
  precision: "fp16"
  confidence_threshold: 0.65
  iou_threshold: 0.5
  max_verification_time_ms: 500
  image_size: 640                           # Higher resolution for accuracy
  batch_size: 1
  
  # ROI processing
  roi_expansion: 1.5                        # Expand ROI by 50%
  
  # Confidence fusion
  confidence_fusion:
    stage1_weight: 0.3
    stage2_weight: 0.7
    minimum_fused: 0.6
  
  # Temporal filtering
  temporal_frames: 3                        # Require 3 consecutive detections
  
  # Spatial consistency
  spatial_consistency:
    max_displacement: 50                    # pixels
    consistency_window: 5                   # frames

# Pipeline Configuration
pipeline:
  queue_size: 1000
  stage2_batch_size: 5
  stage2_timeout_ms: 100
  frame_skip: 1                             # Process every Nth frame
  adaptive_processing: true
  max_end_to_end_ms: 2000

# Redis Configuration
redis:
  enabled: true
  host: "localhost"
  port: 6379
  db: 0
  password: null
  max_connections: 20
  timeout: 5
  connect_timeout: 5
  
  # Queue settings
  stage1_queue: "scope:tokens:stage1"
  stage2_queue: "scope:tokens:stage2"
  events_queue: "scope:events:validated"
  
  # TTL settings
  token_ttl: 60                             # seconds
  queue_ttl: 3600                           # seconds
  events_ttl: 86400                         # seconds (24 hours)

# MQTT Configuration
mqtt:
  enabled: true
  broker_host: "localhost"
  broker_port: 1883
  client_id: "scope_detection_system"
  username: null
  password: null
  keepalive: 60
  clean_session: true
  
  # Topics
  base_topic: "scope/detection"
  
  # QoS and reliability
  qos: 1
  retry_attempts: 3
  retry_delay: 30
  retry_interval: 30
  max_queue_size: 10000
  
  # SSL/TLS (optional)
  use_ssl: false
  ssl:
    cert_required: true
    check_hostname: true
    ca_certs: null
    certfile: null
    keyfile: null

# Camera Configuration
camera:
  default_source: "rtsp://admin:123456@192.168.12.205:80/ch3_0.264"
  rtsp:
    enabled: true
    timeout: 5000
    buffer_size: 1
    reconnect_attempts: 3
    reconnect_delay: 5
  
  # Camera properties
  resolution:
    width: 1280
    height: 720
  fps: 30
  
  # Multi-camera support
  cameras:
    cam_01:
      source: "rtsp://admin:123456@192.168.12.205:80/ch3_0.264"
      location: "main_entrance"
      enabled: true
    cam_02:
      source: 0  # Local webcam for testing
      location: "test_area"
      enabled: false

# Performance Monitoring
monitoring:
  enabled: true
  stats_interval: 10                        # seconds
  performance_window: 100                   # number of samples
  alert_thresholds:
    stage1_latency_ms: 30
    stage2_latency_ms: 600
    end_to_end_latency_ms: 2500
    memory_usage_percent: 90

# TensorRT Configuration - Windows NVIDIA Optimized
tensorrt:
  enabled: true
  workspace_size_gb: 6                     # Increased for Windows NVIDIA
  precision_mode: "fp16"                    # Optimal for Windows RTX/GTX cards
  calibration_samples: 200                  # More samples for Windows deployment
  
  # Engine paths (Windows paths)
  engines_dir: "tensorrt_engines"
  auto_convert: true                        # Convert models on first run
  
  # Windows NVIDIA optimization settings
  max_batch_size: 8                        # Higher batch for Windows GPU
  enable_dynamic_shapes: true              # Better Windows GPU utilization
  optimization_level: 5                    # Maximum optimization for Windows
  enable_cuda_graph: true                  # Windows CUDA graph optimization

# Logging Configuration
logging:
  level: "INFO"                             # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/scope_detection.log"
  max_file_size_mb: 100
  backup_count: 5
  
  # Component-specific logging
  components:
    cuda_memory_manager: "INFO"
    stage1_detector: "INFO" 
    stage2_verifier: "INFO"
    pipeline_coordinator: "INFO"
    redis_manager: "INFO"
    mqtt_publisher: "INFO"

# Development Settings
development:
  debug_mode: false
  save_debug_images: false
  debug_images_dir: "debug_images"
  profile_performance: false
  mock_redis: false
  mock_mqtt: false